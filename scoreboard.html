<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scoreboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{

background:linear-gradient(135deg,#0b1e36,#173d6b);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

}

.container{

width:100%;
max-width:650px;
text-align:center;

}

h1{

color:white;
font-size:42px;
margin-bottom:35px;
letter-spacing:2px;

}

.grid{

display:grid;
gap:18px;

}

.card{

display:block;
text-decoration:none;

background:white;
color:#173d6b;

padding:22px;

border-radius:18px;

font-size:24px;

font-weight:bold;

box-shadow:0 10px 25px rgba(0,0,0,.25);

transition:.3s;

}

.card:hover{

transform:translateY(-5px);

background:#FFD54F;

color:#000;

}

.card span{

font-size:34px;
display:block;
margin-bottom:8px;

}

.back{

margin-top:30px;

display:inline-block;

text-decoration:none;

color:white;

font-size:20px;

}

.back:hover{

text-decoration:underline;

}

@media(max-width:600px){

h1{

font-size:34px;

}

.card{

padding:20px;

font-size:22px;

}

.card span{

font-size:30px;

}

}

</style>

</head>

<body>

<div class="container">

<h1>🏆 SCOREBOARD</h1>

<div class="grid">

<a href="su junior.html" class="card">

<span></span>

SUB JUNIOR

</a>

<a href="#" class="card">

<span></span>

SENIOR

</a>

<a href="#" class="card">

<span></span>

SUPER SENIOR

</a>

<a href="#" class="card">

<span></span>

GENERAL

</a>

<a href="#" class="card">

<span>🏆</span>

GRAND TOTAL

</a>

</div>

<a href="index.html" class="back">

← Back to Home

</a>

</div>

</body>

</html>
