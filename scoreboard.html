<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scoreboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{

background:linear-gradient(135deg,#0b1e36,#173d6b);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

}

.container{

width:100%;
max-width:650px;
text-align:center;

}

h1{

color:white;
font-size:42px;
margin-bottom:35px;
letter-spacing:2px;

}

.grid{

display:grid;
gap:18px;

}

.card{

display:block;
text-decoration:none;

background:white;
color:#173d6b;

padding:22px;

border-radius:18px;

font-size:24px;

font-weight:bold;

box-shadow:0 10px 25px rgba(0,0,0,.25);

transition:.3s;

}

.card:hover{

transform:translateY(-5px);

background:#FFD54F;

color:#000;

}

.card span{

font-size:34px;
display:block;
margin-bottom:8px;

}

.back{

display:inline-flex;

align-items:center;

justify-content:center;

margin-top:28px;

padding:12px 26px;

background:rgba(255,255,255,.12);

border:1px solid rgba(255,255,255,.18);

border-radius:30px;

color:rgba(255,255,255,.9);

text-decoration:none;

font-size:17px;

font-weight:600;

backdrop-filter:blur(8px);

-webkit-backdrop-filter:blur(8px);

transition:all .25s ease;

}

.back:hover{

background:rgba(255,255,255,.20);

border-color:rgba(255,255,255,.35);

color:#fff;

text-decoration:none;

transform:translateY(-2px);

box-shadow:0 6px 18px rgba(0,0,0,.18);

}

.back:active{

transform:scale(.97);

}

@media(max-width:600px){

h1{

font-size:34px;

}

.card{

padding:20px;

font-size:22px;

}

.card span{

font-size:30px;

}

}

</style>

</head>

<body>

<div class="container">

<h1>🏆 SCOREBOARD</h1>

<div class="grid">

<a href="results.html?category=SUB%20JUNIOR" class="card">

SUB JUNIOR

</a>

<a href="results.html?category=SENIOR" class="card">

SENIOR

</a>

<a href="results.html?category=SUPER%20SENIOR" class="card">

SUPER SENIOR

</a>

<a href="results.html?category=GENERAL" class="card">

GENERAL

</a>

<a href="grandtotal.html" class="card">

<span>🏆</span>

GRAND TOTAL

</a>

</div>

<a href="index.html" class="back">

⌂ Home

</a>

</div>

</body>

</html>
