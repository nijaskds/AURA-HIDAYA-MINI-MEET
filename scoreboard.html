<!DOCTYPE html>
<html>
<head>
<title>Scoreboard</title>
<style>

body{
font-family:Segoe UI;
background:#f5f5f5;
padding:40px;
}

h1{
text-align:center;
}

.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:40px;

}

.card{

background:white;
padding:25px;
border-radius:12px;
text-align:center;
font-size:22px;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,.15);
cursor:pointer;
transition:.3s;

}

.card:hover{

background:#0b5ed7;
color:white;
transform:translateY(-5px);

}

</style>
</head>

<body>

<h1>🏆 SCOREBOARD</h1>

<div class="grid">

<div class="card">SUB JUNIOR</div>

<div class="card">SENIOR</div>

<div class="card">SUPER SENIOR</div>

<div class="card">GENERAL</div>

<div class="card">GRAND TOTAL</div>

</div>

</body>
</html>
