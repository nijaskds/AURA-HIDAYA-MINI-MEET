<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Schedule | AURA MINI MEET 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Poppins',sans-serif;

background:
linear-gradient(
135deg,
#050A17,
#0D1F3A,
#173763
);

color:white;

min-height:100vh;

padding:20px;

}

.container{

max-width:1100px;

margin:auto;

}


/* =========================
   HEADER
========================= */

.header{

text-align:center;

margin-bottom:35px;

}

.header h1{

font-size:46px;

font-weight:800;

letter-spacing:2px;

color:#FFD54F;

text-shadow:

0 3px 15px rgba(0,0,0,.4);

}

.header p{

margin-top:8px;

font-size:17px;

color:#ddd;

}

.divider{

width:90px;

height:4px;

background:#FFD54F;

border-radius:50px;

margin:18px auto 0;

}


/* =========================
   NEXT EVENT
========================= */

.next-card{

background:
linear-gradient(
135deg,
#FFD54F,
#E5B900
);

color:#222;

border-radius:25px;

padding:28px 25px;

margin-bottom:35px;

text-align:center;

box-shadow:

0 15px 40px rgba(255,215,79,.25);

position:relative;

overflow:hidden;

}

.next-card::before{

content:"";

position:absolute;

width:220px;

height:220px;

border-radius:50%;

background:rgba(255,255,255,.12);

top:-120px;

right:-70px;

}

.next-label{

font-size:15px;

font-weight:800;

letter-spacing:2px;

margin-bottom:10px;

}

.next-event{

font-size:30px;

font-weight:800;

margin-bottom:10px;

}

.next-details{

font-size:17px;

font-weight:600;

}


/* =========================
   SECTION TITLE
========================= */

.section-title{

text-align:center;

font-size:29px;

font-weight:700;

color:#FFD54F;

margin:35px 0 22px;

}


/* =========================
   SCHEDULE LIST
========================= */

.schedule-container{

display:flex;

flex-direction:column;

gap:15px;

}


/* =========================
   SCHEDULE CARD
========================= */

.schedule-card{

display:grid;

grid-template-columns:130px 1fr auto;

align-items:center;

gap:20px;

padding:20px;

background:rgba(255,255,255,.07);

border:1px solid rgba(255,255,255,.10);

border-radius:20px;

backdrop-filter:blur(10px);

box-shadow:

0 10px 25px rgba(0,0,0,.22);

transition:.3s;

}

.schedule-card:hover{

transform:translateY(-3px);

border-color:rgba(255,215,79,.5);

}


/* =========================
   TIME
========================= */

.time{

font-size:20px;

font-weight:800;

color:#FFD54F;

}


/* =========================
   EVENT
========================= */

.event-name{

font-size:21px;

font-weight:700;

margin-bottom:5px;

}

.event-meta{

font-size:14px;

color:#cfd5df;

}


/* =========================
   STAGE BADGE
========================= */

.stage{

display:inline-block;

padding:7px 13px;

border-radius:20px;

background:#20395D;

color:#fff;

font-size:13px;

font-weight:700;

white-space:nowrap;

}


/* =========================
   STATUS
========================= */

.status{

display:inline-block;

margin-top:7px;

padding:5px 11px;

border-radius:20px;

font-size:12px;

font-weight:700;

}

.status-live{

background:#ff2d55;

color:white;

}

.status-next{

background:#FFD54F;

color:#222;

}

.status-upcoming{

background:#00B894;

color:white;

}

.status-completed{

background:rgba(255,255,255,.12);

color:#aaa;

}


/* =========================
   DATE HEADER
========================= */

.date-header{

margin-top:30px;

margin-bottom:15px;

padding:13px 18px;

border-radius:15px;

background:rgba(255,215,79,.10);

border-left:4px solid #FFD54F;

font-size:18px;

font-weight:700;

color:#FFD54F;

}


/* =========================
   LOADING
========================= */

.loading{

text-align:center;

padding:50px 20px;

color:#bbb;

font-size:18px;

}

.spinner{

width:35px;

height:35px;

border:4px solid rgba(255,255,255,.15);

border-top:4px solid #FFD54F;

border-radius:50%;

margin:0 auto 18px;

animation:spin 1s linear infinite;

}

@keyframes spin{

to{

transform:rotate(360deg);

}

}


/* =========================
   EMPTY
========================= */

.empty{

text-align:center;

padding:45px 20px;

color:#aaa;

background:rgba(255,255,255,.05);

border-radius:20px;

}


/* =========================
   HOME BUTTON
========================= */

.home-box{

text-align:center;

margin-top:40px;

}

.back{

display:inline-flex;

align-items:center;

justify-content:center;

padding:14px 34px;

border-radius:35px;

text-decoration:none;

font-size:18px;

font-weight:700;

background:rgba(255,255,255,.10);

color:white;

border:1px solid rgba(255,255,255,.15);

backdrop-filter:blur(10px);

transition:.3s;

}

.back:hover{

background:#FFD54F;

color:#222;

transform:translateY(-3px);

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

body{

padding:15px;

}

.header h1{

font-size:36px;

}

.header p{

font-size:15px;

}

.next-card{

padding:25px 18px;

}

.next-event{

font-size:24px;

}

.next-details{

font-size:15px;

}

.section-title{

font-size:25px;

}

.schedule-card{

grid-template-columns:1fr;

gap:10px;

padding:18px;

}

.time{

font-size:19px;

}

.event-name{

font-size:20px;

}

.stage{

justify-self:start;

}

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     HEADER
========================= -->

<div class="header">

<h1>

📅 SCHEDULE

</h1>

<p>

AURA MINI MEET 2026

</p>

<div class="divider"></div>

</div>


<!-- =========================
     NEXT EVENT
========================= -->

<div id="nextEvent">

<div class="next-card">

<div class="next-label">

⏳ NEXT EVENT

</div>

<div class="next-event">

Loading...

</div>

<div class="next-details">

Please wait...

</div>

</div>

</div>


<!-- =========================
     UPCOMING
========================= -->

<h2 class="section-title">

📋 EVENT SCHEDULE

</h2>


<div id="scheduleContainer"
class="schedule-container">

<div class="loading">

<div class="spinner"></div>

Loading Schedule...

</div>

</div>


<!-- =========================
     HOME
========================= -->

<div class="home-box">

<a href="index.html"
class="back">

⌂ Home

</a>

</div>


</div>


<!-- =========================
     JAVASCRIPT
========================= -->

<script src="schedule.js?v=1"></script>


</body>

</html>
