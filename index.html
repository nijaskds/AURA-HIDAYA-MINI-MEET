<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HIDAYA MINI MEET 2026</title>

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;

}

body{

background:
linear-gradient(rgba(7,26,52,.92),rgba(13,59,114,.92)),
url("background.jpg");

background-size:cover;

background-position:center;

background-attachment:fixed;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

color:white;

}

.container{

width:100%;

max-width:700px;

text-align:center;

animation:fadeIn .9s ease;

}

.logo-box{

width:180px;

height:180px;

margin:auto;

border-radius:50%;

background:rgba(255,255,255,.08);

display:flex;

justify-content:center;

align-items:center;

backdrop-filter:blur(10px);

box-shadow:0 0 45px rgba(255,215,0,.35);

margin-bottom:25px;

}

.logo{

width:150px;

max-width:100%;

}

h1{

font-size:58px;

letter-spacing:5px;

margin-bottom:10px;

color:#FFD54F;

text-shadow:0 3px 12px rgba(0,0,0,.35);

}

h2{

font-size:30px;

font-weight:500;

margin-bottom:12px;

}

.location{

color:#dddddd;

font-size:18px;

margin-bottom:35px;

}

.divider{

width:90px;

height:4px;

background:#FFD54F;

margin:0 auto 35px;

border-radius:50px;

}

.button{

display:block;

width:100%;

padding:20px;

margin:18px 0;

border-radius:18px;

font-size:24px;

font-weight:bold;

text-decoration:none;

color:white;

transition:.3s;

box-shadow:0 10px 25px rgba(0,0,0,.25);

}

.button:hover{

transform:translateY(-4px);

}

.score{

background:#F4B400;

}

.score:hover{

background:#FFD54F;

color:#000;

}

.kalaprathibha{

background:#8E44AD;

}

.kalaprathibha:hover{

background:#C56CF0;

color:#000;

}

.live{

background:#00B894;

}

.live:hover{

background:#55EFC4;

color:#000;

}

.schedule{

background:#1565C0;

}

.schedule:hover{

background:#42A5F5;

color:#000;

}

.gallery{

background:#6D4C41;

}

.gallery:hover{

background:#A1887F;

color:#000;

}

.committee{

background:#37474F;

}

.committee:hover{

background:#90A4AE;

color:#000;

}

.footer{

margin-top:40px;

font-size:14px;

color:#d8d8d8;

letter-spacing:1px;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@media(max-width:600px){

.logo-box{

width:145px;

height:145px;

}

.logo{

width:120px;

}

h1{

font-size:44px;

}

h2{

font-size:24px;

}

.button{

font-size:21px;

padding:18px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="logo-box">

<img src="aura-logo.png" class="logo">

</div>

<h1>AURA</h1>

<h2>HIDAYA MINI MEET 2026</h2>

Darul Hidaya Islamic Academy, Kuttamboor

</div>

</div>

</body>

</html>
