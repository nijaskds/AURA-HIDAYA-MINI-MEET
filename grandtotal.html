<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grand Total</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:linear-gradient(135deg,#071A34,#0D3B72,#C79A1B);

color:white;

padding:18px;

}

.container{

max-width:950px;

margin:auto;

}

.header{

text-align:center;

margin-bottom:30px;

}

.header h1{

font-size:42px;

letter-spacing:2px;

color:#FFD54F;

}

.header p{

margin-top:8px;

font-size:18px;

color:#eeeeee;

}

.champion{

background:linear-gradient(135deg,#FFD54F,#E4B400);

color:#222;

border-radius:18px;

padding:25px;

text-align:center;

margin-bottom:30px;

box-shadow:0 10px 25px rgba(0,0,0,.25);

font-size:24px;

font-weight:bold;

}

.rank-board{

background:white;

color:#222;

border-radius:18px;

padding:20px;

margin-bottom:30px;

box-shadow:0 10px 25px rgba(0,0,0,.25);

}

.rank-board h2{

text-align:center;

margin-bottom:18px;

color:#B8860B;

}

.rank{

display:flex;

justify-content:space-between;

padding:15px;

font-size:22px;

border-bottom:1px solid #ddd;

}

.rank:last-child{

border-bottom:none;

}

.table-box{

margin-top:35px;

background:white;

color:#222;

border-radius:18px;

padding:20px;

overflow-x:auto;

box-shadow:0 10px 25px rgba(0,0,0,.25);

}

.table-box h2{

text-align:center;

margin-bottom:20px;

color:#B8860B;

}

.waiting{

text-align:center;

padding:20px;

color:#888;

font-style:italic;

}

table{

width:100%;

border-collapse:collapse;

}

th{

background:#143B75;

color:#fff;

padding:12px;

}

td{

padding:11px;

text-align:center;

border-bottom:1px solid #ddd;

}

.back{

display:inline-flex;

align-items:center;

justify-content:center;

margin-top:35px;

padding:12px 26px;

background:rgba(255,255,255,.12);

border:1px solid rgba(255,255,255,.18);

border-radius:30px;

color:white;

text-decoration:none;

font-size:17px;

font-weight:600;

transition:.25s;

}

.back:hover{

background:rgba(255,255,255,.20);

}

@media(max-width:700px){

.header h1{

font-size:32px;

}

.rank{

font-size:18px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>🏆 GRAND TOTAL</h1>

<p>HIDAYA MINI MEET 2026</p>

</div>

<div class="champion" id="champion">

Loading Champion...

</div>

<div class="rank-board">

<h2>LIVE OVERALL RANKING</h2>

<div id="ranking">

<div class="waiting">

Loading ranking...

</div>

</div>

</div>

<div class="table-box">

<h2>GRAND TOTAL SUMMARY</h2>

<div id="pointTable">

<div class="waiting">

Loading summary...

</div>

</div>

</div>
<div style="text-align:center;">

<a href="scoreboard.html" class="back">

⌂ Scoreboard

</a>

</div>

</div>

<script src="grandtotal.js"></script>

</body>

</html>
